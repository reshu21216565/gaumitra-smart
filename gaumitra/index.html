<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gaumitra – Cattle, feed, medicines and equipment</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Malayalam:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafaf8;--cd:#fff;--tx:#17201b;--mu:#66706a;--ln:#e4e4df;--ac:#14452c;--on:#fff;--hl:#f1f0ec;--st:#b45309;--ok:#1a7f4b;--rd:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1311;--cd:#171c19;--tx:#ecf0ed;--mu:#9aa5a0;--ln:#2a312d;--ac:#7ccfa0;--on:#0b140f;--hl:#1f2622;--st:#f0b34a;--ok:#5fcf93;--rd:#ff8c82}}
:root[data-theme="dark"]{--bg:#0f1311;--cd:#171c19;--tx:#ecf0ed;--mu:#9aa5a0;--ln:#2a312d;--ac:#7ccfa0;--on:#0b140f;--hl:#1f2622;--st:#f0b34a;--ok:#5fcf93;--rd:#ff8c82}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Inter,'Noto Sans Devanagari','Noto Sans Telugu','Noto Sans Tamil','Noto Sans Kannada','Noto Sans Malayalam',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#121a15;z-index:50}
h1,h2,h3{margin:0;line-height:1.25;letter-spacing:-.01em;font-weight:650}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.w{max-width:1200px;margin:0 auto;padding:0 20px}
.ut{background:#121a15;color:#cfd6d1;font-size:13px}.ut .w{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:38px;flex-wrap:wrap}
.ut button{background:none;border:0;color:#cfd6d1;padding:6px 8px;min-height:32px}.ut button[aria-pressed=true]{color:#fff;font-weight:600;text-decoration:underline}
.ut svg{width:16px;height:16px;vertical-align:-3px}.ut .r{display:flex;align-items:center;gap:2px}
.hd{background:var(--cd);border-bottom:1px solid var(--ln);position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.hr{display:flex;align-items:center;gap:20px;min-height:68px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.mk{width:32px;height:32px;border-radius:8px;background:var(--ac);color:var(--on);display:grid;place-items:center;font-size:18px;font-weight:700}
.sb{flex:1;min-width:240px;display:flex;border:1px solid var(--ln);border-radius:10px;background:var(--bg);overflow:hidden;order:3}
@media(min-width:900px){.sb{order:0}}
.sb select{border:0;border-right:1px solid var(--ln);background:var(--hl);padding:0 10px;max-width:130px}.sb input{flex:1;min-width:0;border:0;background:none;padding:0 14px;min-height:44px}
.sb button{border:0;background:var(--ac);color:var(--on);width:50px;display:grid;place-items:center}.sb svg{width:20px;height:20px}
.act{display:flex;gap:4px;margin-left:auto}.act a{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 10px;border-radius:8px;font-weight:500;position:relative}.act a:hover{background:var(--hl)}
.act svg{width:22px;height:22px}svg.i{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bd{position:absolute;top:2px;right:2px;background:var(--ac);color:var(--on);border-radius:99px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;font-weight:600}
.cn{display:flex;gap:2px;overflow-x:auto;border-top:1px solid var(--ln)}.cn a{padding:12px 14px;font-weight:500;white-space:nowrap;color:var(--mu);border-bottom:2px solid transparent}.cn a[aria-current=page],.cn a:hover{color:var(--tx);border-color:var(--ac)}.cn .sp{flex:1}
.btn,.b2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:8px;border:1px solid var(--ac);background:var(--ac);color:var(--on);font-weight:600;width:fit-content}
.b2{width:100%;min-height:40px;background:none;color:var(--ac)}.b2:hover{background:var(--ac);color:var(--on)}.ol{background:none;color:var(--ac)}.dg{background:var(--rd);border-color:var(--rd);color:#fff}.fw{width:100%}
.hero{background:var(--hl);border:1px solid var(--ln);border-radius:16px;padding:52px 36px;margin:22px 0;display:grid;grid-template-columns:1.4fr 1fr;gap:30px;align-items:center}
.hero h1{font-size:clamp(30px,4.6vw,50px);letter-spacing:-.03em;max-width:15ch}.hero p{color:var(--mu);font-size:18px;max-width:42ch;margin:14px 0 22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--ln);background:var(--cd);border-radius:99px;padding:6px 14px;font-size:14px;min-height:36px}.chip:hover{border-color:var(--ac)}
.sec{display:flex;justify-content:space-between;align-items:end;margin:34px 0 14px}.sec h2{font-size:22px}.sec a{color:var(--ac);font-weight:600}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.cc{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:18px;display:grid;gap:2px}.cc:hover{border-color:var(--ac)}.cc b{font-size:17px}.cc span{color:var(--mu);font-size:14px}.cc i{font-style:normal;color:var(--ac);font-weight:600;margin-top:10px}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.cd{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:12px;display:grid;gap:6px;position:relative;align-content:start;transition:box-shadow .2s}.cd:hover{box-shadow:0 6px 20px #0001}
.im{aspect-ratio:4/3;background:var(--hl);border-radius:8px;display:grid;place-items:center;color:var(--mu);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;overflow:hidden}.im img{width:100%;height:100%;object-fit:cover}
.bn{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.06em;margin-top:6px}.cd h3{font-size:15px;min-height:42px;font-weight:600}
.hb{position:absolute;top:18px;right:18px;border:0;background:var(--cd);border-radius:50%;width:36px;height:36px;font-size:19px;color:var(--rd);box-shadow:0 1px 4px #0002}
.rt{color:var(--st);font-weight:600;font-size:14px}.mu{color:var(--mu);font-size:14px}.pr b{font-size:19px}.pr s{color:var(--mu);font-size:14px;margin:0 4px}.pr em{color:var(--ok);font-style:normal;font-weight:600;font-size:14px}
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:36px 0}.tg div{border-left:3px solid var(--ac);padding:2px 14px}.tg b{display:block}.tg span{color:var(--mu);font-size:14px}
.bc{margin:18px 0 6px;color:var(--mu);font-size:14px}.bc a:hover{color:var(--ac)}.top2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}.top2 h1{font-size:28px}
.lay{display:grid;grid-template-columns:250px 1fr;gap:22px;align-items:start}
.fd{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:4px 16px;position:sticky;top:150px}.fd summary{font-weight:650;padding:12px 0;cursor:pointer}
.fg{border-top:1px solid var(--ln);padding:12px 0}.fg b{display:block;margin-bottom:4px;font-size:14px}.fg label{display:flex;gap:10px;align-items:center;min-height:34px;font-size:15px}.fg input{width:18px;height:18px;accent-color:var(--ac)}
.sr{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.sr select,.inp{min-height:44px;border:1px solid var(--ln);border-radius:8px;background:var(--cd);padding:0 12px;width:100%}.sr select{width:auto}textarea.inp{padding:10px 12px;min-height:90px}
@media(max-width:899px){.lay,.pd,.cl,.hero{grid-template-columns:1fr!important}.fd{position:static}.hero{padding:32px 20px}}
.pd{display:grid;grid-template-columns:1fr 1.1fr;gap:34px;margin:18px 0}.pd .im{aspect-ratio:1/1;font-size:14px}.pd h1{font-size:30px}.pd .pr b{font-size:32px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--ln);border-radius:8px;background:var(--cd)}.qty button{width:42px;height:42px;border:0;background:none;font-size:20px}.qty span{min-width:34px;text-align:center;font-weight:600}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;align-items:center}
.tb{width:100%;border-collapse:collapse;font-size:15px}.tb td{border-top:1px solid var(--ln);padding:9px 0}.tb td:first-child{color:var(--mu);width:38%}
.cl{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:start;margin:18px 0}
.box{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:20px;display:grid;gap:12px}
.li{display:grid;grid-template-columns:80px 1fr auto;gap:14px;align-items:center;border-bottom:1px solid var(--ln);padding:12px 0}.li .im{font-size:9px}
.sm{display:flex;justify-content:space-between;gap:10px}.sm.t{font-weight:650;font-size:18px;border-top:1px solid var(--ln);padding-top:10px}
label.f{display:grid;gap:5px;font-weight:500;font-size:14px}
.badge{display:inline-block;border-radius:6px;padding:2px 10px;font-weight:600;font-size:13px;background:var(--hl)}.badge.x{background:#fde1de;color:#8c1d18}.badge.g{background:#dcf2e5;color:#14522b}
.tl{display:grid;margin:8px 0}.st{display:grid;grid-template-columns:30px 1fr;gap:14px;padding-bottom:20px;position:relative}.st::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--ln)}.st:last-child::before{display:none}.st.d::before{background:var(--ac)}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--ln);display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--cd)}.st.d .dot{background:var(--ac);border-color:var(--ac);color:var(--on)}.st.c .dot{border-color:var(--ac);color:var(--ac)}
.oc{background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:12px;display:grid;gap:6px}
.acc details{border-bottom:1px solid var(--ln);padding:12px 0}.acc summary{font-weight:600;cursor:pointer}.acc p{color:var(--mu);margin:8px 0 0}
table.g{width:100%;border-collapse:collapse;background:var(--cd);border:1px solid var(--ln);border-radius:12px}table.g th,table.g td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--ln)}table.g th{color:var(--mu);font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.cp{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px dashed var(--ac);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--cd)}.cp b{letter-spacing:.06em}
footer{background:#121a15;color:#aeb8b2;margin-top:48px;padding:36px 0 40px;font-size:14px}footer .w{display:flex;gap:40px;flex-wrap:wrap;justify-content:space-between}footer b{color:#fff;display:block;margin-bottom:8px}footer a{display:block;padding:3px 0}footer a:hover{color:#fff}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:35;min-height:48px;border:0;border-radius:99px;background:var(--ac);color:var(--on);padding:0 20px;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px #0004}.fab svg{width:20px;height:20px}
.aip{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 24px));height:min(580px,calc(100vh - 96px));background:var(--cd);border:1px solid var(--ln);border-radius:18px;z-index:40;padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 18px 50px rgba(0,0,0,0.35);backdrop-filter:blur(8px)}.aip[hidden]{display:none}
.ah{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 8px;border-bottom:1px solid var(--ln)}.ah b{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--tx)}.ah b::before{content:"";width:9px;height:9px;border-radius:50%;background:#10b981;box-shadow:0 0 8px #10b981}.ah button{border:0;background:none;font-size:18px;color:var(--mu);min-width:32px;min-height:32px;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:background .15s}.ah button:hover{background:var(--hl);color:var(--tx)}
.chat{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 2px 8px;scroll-behavior:smooth}
.chat::-webkit-scrollbar{width:5px}.chat::-webkit-scrollbar-thumb{background:var(--ln);border-radius:99px}
.msg{padding:10px 14px;border-radius:16px;max-width:90%;font-size:13.5px;line-height:1.45;word-break:break-word}.msg.u{background:var(--ac);color:var(--on);align-self:flex-end;border-bottom-right-radius:4px}.msg.a{background:var(--hl);color:var(--tx);border:1px solid var(--ln);align-self:flex-start;border-bottom-left-radius:4px;max-width:96%;width:calc(100% - 16px)}
.chat-carousel-box{margin-top:10px;background:var(--cd);border:1px solid var(--ln);border-radius:12px;padding:8px 8px 10px}
.chat-carousel-bar{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;padding:0 2px}
.chat-carousel-hint{font-size:11px;color:var(--ac);text-transform:none;font-weight:500}
.chat-cards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.chat-cards::-webkit-scrollbar{height:4px}.chat-cards::-webkit-scrollbar-thumb{background:var(--ln);border-radius:99px}
.chat-card{flex:0 0 160px;width:160px;scroll-snap-align:start;background:var(--hl);border:1px solid var(--ln);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;transition:all .15s}
.chat-card:hover{border-color:var(--ac);transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,0.14)}
.chat-card-im{width:100%;height:84px;background:var(--cd);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--ln);text-decoration:none;color:var(--mu);font-size:11px;font-weight:600}
.chat-card-im img{width:100%;height:100%;object-fit:cover}
.chat-card-info{padding:8px;display:flex;flex-direction:column;flex:1;gap:3px}
.chat-card-meta{display:flex;align-items:center;gap:4px;font-size:10px}
.chat-card-badge{background:var(--cd);padding:1px 5px;border-radius:4px;font-weight:700;color:var(--ac);text-transform:capitalize}
.chat-card-title{font-size:12px;font-weight:600;color:var(--tx);text-decoration:none;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}
.chat-card-title:hover{color:var(--ac)}
.chat-card-price{font-size:13px;color:var(--tx);margin-top:auto;padding-top:2px}
.chat-card-price b{color:var(--tx)}
.chat-card-price s{font-size:11px;color:var(--mu);margin-left:4px}
.chat-card-actions{display:flex;gap:5px;align-items:center;margin-top:6px}
.chat-card-view{flex:1;text-align:center;border:1px solid var(--ln);background:var(--cd);color:var(--tx);padding:5px 0;border-radius:6px;font-size:11px;text-decoration:none;font-weight:500}
.chat-card-view:hover{border-color:var(--ac);color:var(--ac)}
.chat-card-btn{flex:1;border:0;background:var(--ac);color:var(--on);padding:5px 0;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;text-align:center}
.chat-card-btn:hover{filter:brightness(1.1)}
.chat-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chat-chip{background:var(--cd);border:1px solid var(--ln);color:var(--tx);padding:5px 10px;border-radius:99px;font-size:12px;cursor:pointer;transition:all .15s}
.chat-chip:hover{background:var(--ac);color:var(--on);border-color:var(--ac)}
.chat-typing{display:inline-flex;gap:5px;align-items:center;padding:6px 2px}
.chat-typing span{width:7px;height:7px;background:var(--ac);border-radius:50%;opacity:.4;animation:chatDot 1.2s infinite ease-in-out}
.chat-typing span:nth-child(2){animation-delay:.2s}
.chat-typing span:nth-child(3){animation-delay:.4s}
@keyframes chatDot{0%,100%{transform:scale(.7);opacity:.3}50%{transform:scale(1.1);opacity:1}}
.ai-in{display:flex;gap:8px;padding-top:4px}
.toast{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translate(-50%,-140px);background:var(--tx);color:var(--bg);padding:12px 22px;border-radius:10px;font-weight:500;transition:.25s;z-index:60;max-width:92vw}.toast.on{transform:translate(-50%,0)}

te:["రోజుకు సుమారు 12 లీటర్ల పాలు. శాంతంగా, ఆరోగ్యంగా, టీకాలు వేసినది.","రోజుకు సుమారు 16 లీటర్లు. ఆరోగ్య పరీక్ష అయింది.","రోజుకు సుమారు 14 లీటర్లు. చిన్న ఫారాలకు మంచిది.","బలమైన సంతానోత్పత్తి ఎద్దు.","రోజుకు సుమారు 18 లీటర్లు. సులభంగా సాకవచ్చు.","ఆరోగ్యమైన దూడ, టీకాలు వేసినది.","స్థిరమైన పాల ఉత్పత్తికి ఖనిజాలు.","పాడి ఆవులకు సమతుల్య గుళికలు.","ఉప్పు మరియు ఖనిజాల బ్లాక్.","తాజా నేపియర్ గడ్డి.","ఎండాకాలం కోసం సిద్ధంగా ఉన్న సైలేజ్.","చిన్న దూడలకు స్టార్టర్ దాణా.","పాడి ఆవులకు క్యాల్షియం.","వైద్యుని సలహా ప్రకారం వాడండి.","గాలికుంటు వ్యాధి టీకా.","పేలు, ఈగల నియంత్రణ.","జీర్ణక్రియకు తోడ్పడుతుంది.","విద్యుత్తో నడిచే గడ్డి కోత యంత్రం.","తీసుకెళ్లగల పాలు పితికే యంత్రం.","స్టీల్ పాల క్యాన్.","దృఢమైన పశువుల తొట్టి.","స్వచ్ఛమైన ఆవు నెయ్యి.","ఫారం పాలతో తయారైనది.","ఫారం నుండి తాజా పాలు.","తోడు వేసిన పెరుగు.","సేంద్రీయ వర్మీకంపోస్ట్.","ఎండిన ఆవు పిడకలు.","చిన్న ఫారం కోసం బయోగ్యాస్ కిట్.","వైద్యుడు మీ ఫారానికి వస్తారు.","వైద్యుడు మీ పశువులకు టీకాలు వేస్తారు.","ఎప్పుడైనా త్వరిత సందర్శన.","ఫోన్లో వైద్యునితో మాట్లాడండి."]};

function createLocalDB() {
  const listeners = {};
  const PREFIX = 'gm_db_';
  const getCol = name => {
    try {
      const raw = localStorage.getItem(PREFIX + name);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  };
  const setCol = (name, docs, notifyFlag = true) => {
    try {
      localStorage.setItem(PREFIX + name, JSON.stringify(docs));
    } catch (e) {
      console.warn('LocalStorage save failed:', e);
    }
    if (notifyFlag) notify(name);
  };
  const notify = name => {
    if (!listeners[name] || !listeners[name].length) return;
    const docs = getCol(name);
    const snap = {
      docs: docs.map(d => ({
        id: d.id,
        data: () => {
          const c = Object.assign({}, d);
          delete c.id;
          return c;
        }
      }))
    };
    listeners[name].forEach(fn => {
      try { fn(snap); } catch (err) { console.error('Snapshot error:', err); }
    });
  };

  if (typeof window !== 'undefined') {
    window.addEventListener('storage', e => {
      if (e.key && e.key.startsWith(PREFIX)) {
        const colName = e.key.slice(PREFIX.length);
        notify(colName);
      }
    });
  }

  return {
    collection(name) {
      return {
        doc(id) {
          return {
            async set(data) {
              const docs = getCol(name);
              const idx = docs.findIndex(d => d.id === id);
              const item = Object.assign({ id }, data);
              if (idx >= 0) docs[idx] = item;
              else docs.push(item);
              setCol(name, docs);
              return item;
            },
            async update(data) {
              const docs = getCol(name);
              const idx = docs.findIndex(d => d.id === id);
              if (idx >= 0) {
                Object.assign(docs[idx], data);
                setCol(name, docs);
              }
            },
            async delete() {
              let docs = getCol(name);
              docs = docs.filter(d => d.id !== id);
              setCol(name, docs);
            }
          };
        },
        onSnapshot(onNext, onError) {
          listeners[name] = listeners[name] || [];
          listeners[name].push(onNext);
          setTimeout(() => {
            const docs = getCol(name);
            const snap = {
              docs: docs.map(d => ({
                id: d.id,
                data: () => {
                  const c = Object.assign({}, d);
                  delete c.id;
                  return c;
                }
              }))
            };
            try { onNext(snap); } catch (err) { console.error(err); }
          }, 0);
          return () => {
            listeners[name] = (listeners[name] || []).filter(fn => fn !== onNext);
          };
        }
      };
    }
  };
}

const localAssets = {
  async upload(file) {
    return new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, 640 / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = img.width * k;
          canvas.height = img.height * k;
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve({ id: canvas.toDataURL("image/jpeg", 0.75) });
        };
        img.onerror = () => resolve({ id: reader.result });
        img.src = reader.result;
      };
      reader.onerror = () => resolve({ id: "" });
      reader.readAsDataURL(file);
    });
  }
};

const localDl = {
  async save({ filename, data }) {
    const blob = new Blob([data], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
};

const myAds=()=>dbx?P.filter(p=>p&&p.adId&&(S.myIds||[]).includes(p.adId)):S.my.filter(x=>!x.del);
const revs=p=>dbx?(DBR[p.id]||[]):(S.rev[p.id]||[]);
let rq=0;const rr=()=>{if(!rq){rq=1;requestAnimationFrame(()=>{rq=0;try{route(1)}catch(_){}})}};
const prune=()=>{if(!(LD.products&&LD.ads))return;S.cart=S.cart.filter(i=>P[i.id]);S.wish=S.wish.filter(i=>P[i]);S.rv=S.rv.filter(i=>P[i])};
const finish=()=>{P.forEach(p=>{if(p&&dbx){const a=DBR[p.id]||[];p.v=(p.v0||0)+a.length;p.r=p.v?Math.round(((p.r0||0)*(p.v0||0)+a.reduce((q,r)=>q+r.r,0))/p.v*10)/10:0}});recalc();prune();rr()};
function onProducts(s){const seen={};s.docs.forEach(d=>{const x=d.data(),pid=x.pid;if(pid==null)return;seen[pid]=1;let p=P[pid];if(!p&&pid>=1000)p=P[pid]={id:pid,c:x.c,n:x.n,b:x.b,p:x.p,m:x.m||x.p,r:0,v:0,r0:0,v0:0,s:x.s||"—",d:x.d||"",dyn:1};if(!p)return;p.p=x.p;p.m=x.m||x.p;p.stock=x.stock;p.stockAt=x.stockAt||0;p.x=x.active===false?1:0;if(x.img)p.img=(x.img.startsWith("data:")||x.img.startsWith("http"))?x.img:"/_blob/"+x.img;if(p.dyn){p.n=x.n;p.b=x.b;p.c=x.c;p.d=x.d||""}else if(x.n&&x.n!==R[pid][1]){p.n=x.n;p.nOv=1}});P.forEach((p,i)=>{if(p&&p.dyn&&!seen[i])delete P[i]});LD.products=1;finish()}
function onAds(s){const keep={};s.docs.forEach(d=>{const x=d.data(),no=x.no;if(!no)return;keep[no]=1;const o={id:no,adId:d.id,adNo:no,c:"cattle",n:x.n,b:x.b,p:x.p,m:x.p,r:0,v:0,r0:0,v0:0,s:x.s,d:x.d||"",img:x.img||"",x:(x.hidden||x.sold)?1:0},old=P[no];if(old&&old.adId===d.id)Object.assign(old,o);else P[no]=o});P.forEach((p,i)=>{if(p&&p.adId&&!keep[i])delete P[i]});LD.ads=1;finish()}
function onOrders(s){ORDS=s.docs.map(d=>d.data());DBOo={};ORDS.forEach(o=>DBOo[o.id]=o);DBO=Object.assign({},DBOo,DBOa);finish()}
function onAppts(s){DBOa={};s.docs.forEach(d=>{const x=d.data();DBOa[x.id||d.id]=x});DBO=Object.assign({},DBOo,DBOa);finish()}
function onRev(s){DBR={};s.docs.forEach(d=>{const x=d.data();if(x.hidden)return;(DBR[x.pid]=DBR[x.pid]||[]).push(x)});Object.values(DBR).forEach(a=>a.sort((q,r)=>q.ts-r.ts));finish()}
function onCoup(s){if(s.docs.length){Object.keys(COUP).forEach(k=>delete COUP[k]);s.docs.forEach(d=>{const x=d.data();if(x.active===false)return;const m=x.min?` on orders above ₹${x.min}`:"";COUP[d.id]={p:x.pct,f:x.flat,min:x.min||0,d:(x.pct?x.pct+"% off":"₹"+x.flat+" off")+m}});if(S.coupon&&!COUP[S.coupon])S.coupon=""}rr()}
function onSet(s){const d=s.docs.find(x=>x.id==="store");SET=d?d.data():{};rr()}
async function connect(){
  let as=null,dl=null;
  const fbDb = initFirebaseDB();
  if(fbDb){
    dbx = fbDb;
    usr = {async canEdit(){return true;},async can(){return true;}};
    as = localAssets;
    dl = localDl;
    isAdmin = true;
    WR = true;
  } else {
    try{
      dbx=await claude.use("db");
      usr=await claude.use("user");
      as=await claude.use("assets");
      dl=await claude.use("downloads");
      isAdmin=usr?!!(await usr.canEdit()):false;
      WR=usr?(typeof usr.can==="function"?(await usr.can("data.write"))!==false:true):false;
    }catch(_){
      dbx=createLocalDB();
      usr={async canEdit(){return true;},async can(){return true;}};
      as=localAssets;
      dl=localDl;
      isAdmin=true;
      WR=true;
    }
  }
  if(dbx){
    const sub=(c,f)=>dbx.collection(c).onSnapshot(f,()=>{});
    sub("products",onProducts);
    sub("ads",onAds);
    sub("orders",onOrders);
    sub("appts",onAppts);
    sub("reviews",onRev);
    sub("coupons",onCoup);
    sub("settings",onSet);
  }else{
    LD.products=LD.ads=1;prune();
  }
  if(window.ADM)ADM.init({db:dbx,user:usr,assets:as,dl,CAN:isAdmin});
  if(!fbDb){
    setTimeout(()=>{
      try{
        const raw=localStorage.getItem("gm_db_products");
        if(!raw || JSON.parse(raw).length===0){
          if(window.ADM && window.ADM.seed) window.ADM.seed();
        }
      }catch(_){}
    },100);
  }
  rr();
}
recalc();

route();connect();
</script>
